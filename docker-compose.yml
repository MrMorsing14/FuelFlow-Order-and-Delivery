# Local development only. The API and Web services are added in Phase 6.
services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: fuelflow
      POSTGRES_USER: fuelflow
      POSTGRES_PASSWORD: fuelflow # dev-only credential
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelflow -d fuelflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
